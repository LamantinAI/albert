[package]
name = "albert"
version = "0.1.0"
edition = "2021"
description = "Albert — the assembly: an Octo cogitator with kaeru memory and a scheduler connector. Talk to it; it remembers and reminds."

[dependencies]
# Octo — the Reaction skeleton, pulled from GitHub (pinned to a rev; no release
# tags yet — bump the rev to track octo main). One repo, many crates.
# (3951560 = octo main; adds octo-connector-search (web search organ; its DDG backend
#  links the SYSTEM libcurl — see the search dep note below). NOTE: linking the mail
#  crate pulls a second rustls provider (ring) alongside reqwest's aws-lc-rs — main()
#  MUST call ensure_crypto_provider().)
octo-core = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
octo-rig = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
octo-history = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302", features = ["sqlite"] }
octo-connector-telegram = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
octo-connector-scheduler = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
octo-connector-caldav = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-code — file/code tools (read/write/edit/list/glob/grep) as rig tools, jailed
# to $OCTO_CODE_WORKSPACE. Ported from llm-coding-tools-rig (Apache-2.0) to rig 0.35.
octo-code = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-connector-storage — durable object store (put/get/list/delete + promote/
# checkout); env-as-tools organ, backend swappable (local dir now, S3 later).
octo-connector-storage = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-connector-forkd — sandboxed script runner (v0) for executable skills:
# forkd.run a script jailed to the workspace, clean env, dropped privileges, timeout.
octo-connector-forkd = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-connector-mail — IMAP read + SMTP send mailbox organ (env-as-tools: mail.cmd.*).
# Wired in but OFF by default: the factory is registered, but no config/connectors/mail
# manifest is shipped (only mail.toml.example), so nothing is instantiated until you add
# one + the creds. Its rustls provider (ring) forces the ensure_crypto_provider() call.
octo-connector-mail = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-connector-search — web search organ (env-as-tools: search.web { query, limit? }).
# Its DuckDuckGo backend fetches through the SYSTEM libcurl, because DDG's anti-bot
# answers reqwest with a 202 challenge (and drops a vendored libcurl's handshake), while
# the system libcurl gets a full page — measured, see the crate docs. Consequences for
# this binary: needs `libcurl4-openssl-dev` to BUILD and links `libcurl.so.4` at RUN time
# (present wherever `curl` is). If a build predates the dev headers, curl-sys silently
# vendored its own copy — `cargo clean -p curl-sys` and rebuild.
# Backend is swappable — Yandex Search API slots in behind the same trait later.
octo-connector-search = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }
# octo-connector-http — the GENERIC configurable connector: a whole REST API becomes an
# env-as-tools organ from a manifest alone (type = "http"), no code. Ported colleague
# work (PR #3) wires Jira this way — config/connectors/jira/jira.toml.
octo-connector-http = { git = "https://github.com/LamantinAI/octo", rev = "3951560b305fe72969e7708cfc2c4ca84bae9302" }

# kaeru — the Memory substrate (v0.5.0 + the cozo-sqlite-dropped fix at 1ac19b6, so
# it stops linking sqlite3 and Albert can use sqlx for its history store).
kaeru-core = { git = "https://github.com/LamantinAI/kaeru", rev = "1ac19b6ea2288dee6a1c6f4c0fb254b5b6572d97" }
kaeru-rig = { git = "https://github.com/LamantinAI/kaeru", rev = "1ac19b6ea2288dee6a1c6f4c0fb254b5b6572d97" }

tokio = { version = "1.40", features = ["full"] }
# futures: drain rig's SSE stream (StreamExt::next) in the Codex subscription model.
futures = "0.3"
# bytes: rewrite the Codex request/response body in the custom rig HttpClientExt
# (codex_http). The reqwest client itself comes via rig's `http_client::ReqwestClient`.
bytes = "1"
# Subscription login/refresh (openai_login / openai_auth): the OAuth PKCE flow and
# token-endpoint calls. reqwest reuses rig's already-built TLS (default-features off,
# just add `json`); sha2 for the PKCE S256 challenge; rand for the verifier/state;
# url to build the authorize URL safely.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
rand = "0.8"
url = "2"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64: decode the JWT access-token payload (subscription auth) to read `exp`
# and the ChatGPT plan claim. URL-safe, no-pad. Already in the tree transitively.
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
toml = "0.8"
rig-core = "0.35"

[dev-dependencies]
tempfile = "3"

# Optimized release profile for the deployed binary (smaller + faster; the target
# is a small VM). opt-level 3 is the release default; the wins are LTO + a single
# codegen unit + strip.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# cozo (pulled transitively via kaeru-core) needs this patch on rustc 1.85+ /
# rayon 1.10+ — the same pin kaeru's own workspace carries. Patches are
# per-workspace-root, so Albert (its own workspace) must repeat it.
[patch.crates-io]
graph_builder = { git = "https://github.com/lawless-m/graph", rev = "790ef623533fa39574ddd11308e3abc3993c0994" }
