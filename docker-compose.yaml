services:
  albert:
    image: ghcr.io/lamantinai/albert:latest
    init: true
    restart: unless-stopped
    ports:
      - "9877:9877"
    environment:
      ALBERT_CONFIG: /opt/albert/albert.toml
      KAERU_VAULT_PATH: /data/kaeru
      OCTO_CODE_WORKSPACE: /data/workspace
      OCTO_SKILLS_DIR: /opt/albert/skills
      # Moli needs a writable home for runtime state.
      HOME: /data
      RUST_LOG: ${RUST_LOG:-albert=info,octo_rig=info,octo_connector_scheduler=info,octo_connector_telegram=info,octo_connector_caldav=info,octo_connector_storage=info,octo_connector_forkd=info,octo_connector_search=info,octo_connector_http=info,octo_connector_mail=info,octo_connector_browser=info,octo_connector_transcribe=info,octo_connector_speak=info,octo_connector_imagegen=info,octo_http_auth=info,octo_core=warn}
      ALBERT_MEMORY_TOKEN: ${KAERU_MCP_AUTH_TOKEN:?Set KAERU_MCP_AUTH_TOKEN in .env}
    cap_add:
      - SETUID
      - SETGID
    volumes:
      # The image initializes missing defaults here and preserves later edits.
      - ./albert:/opt/albert
      - albert-data:/data
    depends_on:
      - kaeru
    networks:
      - default
      - memory

  kaeru:
    image: ghcr.io/lamantinai/kaeru-mcp:latest
    restart: unless-stopped
    environment:
      KAERU_MCP_LISTEN_ADDRESS: 0.0.0.0
      KAERU_MCP_ALLOWED_HOSTS: kaeru:9876
      KAERU_MCP_AUTH_TOKEN: ${KAERU_MCP_AUTH_TOKEN:?Set KAERU_MCP_AUTH_TOKEN in .env}
    volumes:
      - kaeru-data:/home/kaeru/.local/share/kaeru
      - kaeru-config:/home/kaeru/.config/kaeru
    networks:
      - memory

volumes:
  albert-data:
  kaeru-data:
  kaeru-config:

networks:
  memory:
    internal: true
