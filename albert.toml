# Albert runtime config. Its path is set by ALBERT_CONFIG in .env (default: next
# to the binary, else this crate dir). Secrets stay in the environment, named here
# by their env-var name (never the value) — so this file is safe to commit.

# LLM backend — two auth modes (details in docs/configuration.md):
#   auth = "api_key"      -> base_url + openai_key_env (OpenRouter / OpenAI-compatible). The default.
#   auth = "subscription" -> a ChatGPT subscription via the OpenAI Codex backend (OAuth). An option.
auth  = "api_key"
model = "deepseek/deepseek-v4-flash"
base_url = "https://openrouter.ai/api/v1"
openai_key_env = "ALBERT_OPENAI_KEY"

# Vision: can the model see photos sent in chat? Omit for the default heuristic
# (subscription -> always yes; api_key -> guessed from the model name).
# multimodal = true

# Hearing: can Albert listen to voice messages? They are transcribed through the
# ChatGPT dictation endpoint, which only accepts a subscription token — hence the
# default (subscription -> yes; api_key -> no, whatever the model can do).
# hearing = true

# Image generation: offer the `imagegen` skill? It draws via the Codex CLI's built-in
# tool on a ChatGPT subscription (no API-key billing) — a SEPARATE credential from
# Albert's own model auth, so it has its own switch. Default off; turn on only where the
# host has the `codex` binary and a subscription auth.json (see the skill).
# imagegen = true

# Live progress in chat while a turn runs (typing indicator is always on; this
# also streams tool calls / thoughts as an in-place edited status message).
# stream_status = true

# --- Subscription mode (option) — set auth = "subscription" above to switch ---
# model = "gpt-5.4"     # Codex slug: gpt-5.6-sol|terra|luna, gpt-5.5, gpt-5.4, gpt-5.4-mini
# [subscription]
# # Reuse the OAuth tokens the `codex` CLI already manages (run `codex login` once);
# # Albert reads auth.json each turn. base_url defaults to the Codex backend.
# auth_json = "~/.codex/auth.json"
# base_url = "https://chatgpt.com/backend-api/codex"

# Owner's timezone (IANA name). The agent's "current time" — and thus its sense
# of "today" and any reminder times it computes — is rendered in this zone rather
# than UTC. Defaults to UTC if omitted. Set the calendar connector's own
# `timezone` (config/connectors/calendar) to match, so listed events read local.
timezone = "Europe/Moscow"

[prompt]
# Persona and operating instructions — hot-reloaded (edit and save; no restart).
# Paths resolve relative to this file.
soul   = "soul.md"
system = "system.md"

[reflection]
period_secs = 21600   # base memory-reflection routine cadence (6h)

# Connectors (Telegram channel, calendar) are config-driven separately, under
# config/connectors/*/*.toml (Octo's from_config_file). See those manifests.

[history]
# "memory" (lost on restart) | "file:<dir>" (JSON per channel) |
# "sqlite:<path>" (durable, migrated — survives restarts; path is cwd-relative).
backend = "sqlite:state/history.db"

[scheduler]
state_path = "state/scheduler.json"

[agent]
max_tool_turns = 30

[skills]
# Declarative skills: a folder of `<name>/SKILL.md` (frontmatter name/description +
# instructions). Albert sees the catalog each turn, lists (skill_list) and applies
# (skill_apply); an applied skill's instructions stay hot in an LRU cache of this
# many. Path resolves relative to this file; a missing folder just means no skills.
dir   = "skills"
cache = 5
# Skill-catalog page size (skill_list) AND the inline threshold: a catalog up to this
# many skills is shown in full each turn; a larger library collapses to a count + a
# skill_search pointer, so it never floods context. skill_search finds by keyword.
page  = 10

[code]
# Ephemeral workspace root the file tools (read/write/edit/list/glob/grep) are
# jailed to. Resolved relative to this file; octo-code creates it on first use. A
# future storage/telegram workspace bridge should point at the SAME directory.
workspace = "state/workspace"

# --- Cloud memory (option) — kaeru-cloud endpoints Albert can share to / pull from.
# Absent = local-only (the default): the share/pull/cloud_recall tools are not even
# shown to the model. Add one [clouds.<name>] per cloud (its URL + the env-var NAME
# of its bearer token; the value stays in .env). Optional [clouds] default picks the
# cloud a tool hits when its `cloud` arg is omitted.
# [clouds]
# default = "family"
#
# [clouds.family]
# url       = "https://cloud.family.example"
# token_env = "ALBERT_CLOUD_FAMILY_TOKEN"
#
# [clouds.work]
# url       = "https://kaeru.work.example"
# token_env = "ALBERT_CLOUD_WORK_TOKEN"
