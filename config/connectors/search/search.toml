# DuckDuckGo shares Albert's Moli process with browser.fetch.
# Enable additional engines after configuring their connection settings.

[connector]
id = "search"
type = "search"
default_engine = "ddg"
timeout_secs = 15
default_limit = 10
max_limit = 25

[connector.engines.ddg]

[connector.engines.tavily]

[connector.engines.yandex]
enabled = false
api_key_env = "YANDEX_SEARCH_API_KEY"
folder_id_env = "YANDEX_SEARCH_FOLDER_ID"
search_type = "ru"  # Use "com" for international results.
# region = "225"

[connector.engines.brave]
enabled = false
api_key_env = "BRAVE_API_KEY"
# search_lang = "ru"
