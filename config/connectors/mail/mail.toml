# REG.RU mailbox — IMAP/SMTP connector (octo-connector-mail).
#
# Reached as env-as-tools: the cogitator dispatches mail.cmd.list/read/send/reply
# and gets a correlated result. Hosts/ports are literals (REG.RU defaults);
# credentials are named env vars, values live in .env. SMTP login and the From
# address default to the IMAP ones (REG.RU uses one login for both). Ported from
# the openclaw regru-mail skill — same mailbox, no node.

[connector]
id   = "mail"
type = "mail"

imap_host = "mail.hosting.reg.ru"
imap_port = 993
smtp_host = "mail.hosting.reg.ru"
smtp_port = 465
mailbox   = "INBOX"

imap_user_env = "MAIL_IMAP_USER"
imap_pass_env = "MAIL_IMAP_PASS"
# Optional overrides (default to the IMAP creds / user):
# smtp_user_env = "MAIL_SMTP_USER"
# smtp_pass_env = "MAIL_SMTP_PASS"
# from_env      = "MAIL_FROM"
