# Mailbox — IMAP/SMTP connector (octo-connector-mail).
#
# Reached as env-as-tools: the cogitator dispatches mail.cmd.list/read/send/reply
# and gets a correlated result. Hosts are literals (imap_host REQUIRED; smtp_host
# defaults to it); credentials are named env vars, values live in .env. SMTP login
# and the From address default to the IMAP ones.
#
# imap_host below is a PLACEHOLDER: put your provider in the deployment's copy of
# this file (the deploy rsync excludes it, like telegram/calendar).

[connector]
id   = "mail"
type = "mail"

imap_host = "imap.example.com"
imap_port = 993
smtp_port = 465
mailbox   = "INBOX"

imap_user_env = "MAIL_IMAP_USER"
imap_pass_env = "MAIL_IMAP_PASS"
# Optional overrides (default to the IMAP creds / user):
# smtp_user_env = "MAIL_SMTP_USER"
# smtp_pass_env = "MAIL_SMTP_PASS"
# from_env      = "MAIL_FROM"
