# Wikimedia Commons — image search (octo-connector-http, pure manifest).
#
# One command, `commons.cmd.search { query }`: full-text search over Commons files
# (namespace 6), each hit with a ~1024px thumbnail URL (`thumbnail.source`), its MIME
# type, title, author, licence and file page (`fullurl`). The agent puts the thumbnail URLs into its reply as Markdown images
# (`![](url "caption")`), which Telegram lays out as photo blocks inside the message.
# Free, no key. Search in English — Commons file titles and descriptions mostly are.

[connector]
id       = "commons"
type     = "http"
base_url = "https://commons.wikimedia.org"

# Wikimedia answers 403 to a request without a descriptive User-Agent.
[connector.headers]
User-Agent = "AlbertBot/0.2 (https://github.com/LamantinAI/albert)"

[connector.timeout]
request_ms = 15000

[connector.retry]
max_attempts       = 2
backoff_initial_ms = 500
backoff_max_ms     = 3000
retry_on_status    = [429, 502, 503, 504]

[[connector.endpoint]]
cmd_kind      = "commons.cmd.search"
method        = "GET"
# Only a ~1024px thumbnail comes back, never the original file: Telegram fetches an inline
# photo itself and refuses one over 5 MB, and Commons originals run to tens of MB (live
# 2026-10-22: a 25 MB original failed the whole rich reply). pageimages gives the
# thumbnail, imageinfo the licence fields, info the file page (fullurl).
path          = "/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrnamespace=6&gsrlimit=8&prop=pageimages|imageinfo|info&piprop=thumbnail&pithumbsize=1024&iiprop=mime|extmetadata&iiextmetadatafilter=ObjectName|Artist|LicenseShortName&inprop=url"
query_params  = { gsrsearch = "$.query" }
response_kind = "commons.event.search"
