# Transcribe connector — recordings to text on the ChatGPT subscription, as an env-as-tools
# organ: transcribe.run { path, language? } -> { text }. Any length: a long recording (or a
# video) is cut on its pauses and comes back with [hh:mm:ss] timecodes (needs ffmpeg on
# the host; without it a file goes up whole).
#
# Rides on the subscription token ([subscription] auth_json in albert.toml): without a
# token on disk it is skipped at startup with a log line. Remove this file to turn it off.
# (Voice messages in chat are heard inline by Albert itself — that is the `hearing` switch
# in albert.toml, not this organ.)

[connector]
id   = "transcribe"
type = "transcribe"

# language         = "ru"   # default hint when a call omits one; omitted -> auto-detected
# chunk_secs       = 300    # long recordings are cut on pauses near this length (60-1380)
# parallel_uploads = 4      # chunks uploaded at once (1-8)
