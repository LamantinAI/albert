# The browser reaches loopback ports through this gateway. Agent and fixture
# containers remain on the internal-only network without outbound internet.
access_log off;
error_log /dev/null crit;
server {
    listen 9877;
    location / {
        proxy_pass http://albert:9877;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
server {
    listen 8000;
    location / {
        proxy_pass http://mock-provider:8000;
        proxy_set_header Host $http_host;
    }
}
