name: ci

# The container build only runs on pushes to main and tags, so until now
# nothing verified a pull request: `cargo test` existed but ran only where a
# developer remembered to type it. This workflow makes the suite the gate.

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libcurl4-openssl-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: web/albert-panel/package-lock.json

      - name: Build and verify browser assets
        working-directory: web/albert-panel
        run: |
          npm ci
          npm run check:api
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run build:embedded

      - name: cargo test --workspace
        run: cargo test --locked --workspace --all-targets
