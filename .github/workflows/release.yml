name: release container

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ['RELEASE_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          identifier = r'(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          if not re.fullmatch(rf'v{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match workspace version {version}')
          PY

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      context: .
      file: ./docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
