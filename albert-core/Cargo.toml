[package]
name = "albert-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["dep:axum", "dep:tempfile"]
local-e2e = ["octo-openai-auth/local-e2e"]

[dependencies]
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
kaeru-core = { workspace = true }
libc = { workspace = true }
kaeru-rig = { workspace = true }
mcp-http = { workspace = true }
octo-approval = { workspace = true }
octo-code = { workspace = true }
octo-core = { workspace = true }
octo-history = { workspace = true }
octo-openai-auth = { workspace = true }
octo-rig = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rig-core = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
octo-connector-sql.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
