# Albert config for the container. Persona/instructions/manifests are baked into the
# image at /opt/albert; every mutable path points at /data (a mounted volume) so
# tokens, memory, history and alarms survive restarts and image rebuilds.

auth  = "subscription"
model = "gpt-5.4"        # Codex slug: gpt-5.6-sol|terra|luna, gpt-5.5, gpt-5.4, gpt-5.4-mini

# Vision (photos in chat): defaults to on under a subscription. Uncomment to force.
# multimodal = true
# Live progress in chat (tool calls / thoughts as an edited status message).
# stream_status = true

timezone = "Europe/Moscow"

[subscription]
# Written by `albert login` (run once inside the container) and read each turn;
# refreshed in place before expiry. On the mounted volume, so it persists.
auth_json = "/data/auth.json"

# Reminders go through the caldav calendar connector (config/connectors/calendar),
# which creates the event AND its popup VALARM — the private [gcal] REST tool is
# gone (connectors-only-in-octo).

[prompt]
soul   = "soul.md"       # baked into the image (hot-reloaded if you bind-mount it)
system = "system.md"

[reflection]
period_secs = 21600

[history]
# Durable across restarts, on the mounted volume (JSON per channel).
backend = "file:/data/history"

[scheduler]
state_path = "/data/state/scheduler.json"

[agent]
# Match main's default — 8 is too few once the file/script/storage tools are in play.
max_tool_turns = 30

[skills]
dir   = "skills"
cache = 5

[code]
# octo-code file-tool jail (also inherited by forkd + storage). On the mounted
# volume so promoted artifacts and in-flight files survive a container restart.
workspace = "/data/workspace"
