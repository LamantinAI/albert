# Albert on the server. One volume (`albert-data` -> /data) holds all runtime state:
# the subscription tokens, the kaeru memory vault, per-channel history, and the
# scheduler alarms — so restarts and image rebuilds never lose anything.
#
#   docker compose build                       # build the image (see README: add swap on 2 GB)
#   docker compose run --rm albert login       # one-time: sign in with the ChatGPT subscription
#   docker compose up -d                        # run the service
#   docker compose logs -f                      # live logs

services:
  albert:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: albert:latest
    container_name: albert
    restart: unless-stopped
    env_file: contrib/deploy/.env
    # The container runs as the unprivileged `albert` user (see docker/Dockerfile).
    # forkd drops skill scripts to `albert-scripts`, which from a non-root process needs
    # these two capabilities — the same ones the systemd unit grants as AmbientCapabilities.
    cap_add:
      - SETUID
      - SETGID
    volumes:
      - albert-data:/data
      # Connector manifests (owner_chat, which calendars) — mounted so you can edit
      # them without rebuilding the image. Read-write so the telegram ACL can persist.
      - ./config:/opt/albert/config
      # Persona + operating instructions, mounted so they can be edited live —
      # they're hot-reloaded by mtime (no rebuild, no restart).
      - ./soul.md:/opt/albert/soul.md:ro
      - ./system.md:/opt/albert/system.md:ro
    # `albert login` needs an interactive terminal for the paste fallback.
    stdin_open: true
    tty: true

volumes:
  albert-data:
